name: Setup cross-build
description: build ci for rust.
author: ahaoboy
branding:
  icon: play-circle
  color: white

inputs:
  bin:
    description: "bin"
    required: false
  target:
    description: "target"
    required: false
  GITHUB_TOKEN:
    description: "GITHUB_TOKEN"
    required: false
  RUSTFLAGS:
    description: "RUSTFLAGS"
    required: false
  tag:
    description: "tag"
    required: false
  makeLatest:
    description: "makeLatest"
    required: false
  allowUpdates:
    description: "allowUpdates"
    required: false
  features:
    description: "features"
    required: false
  toolchain:
    description: "toolchain"
    required: false
    default: "stable"
  archive:
    description: "archive"
    required: false
    default: "$bin-$target"
  upload-artifact:
    description: "upload-artifact"
    required: false
    default: "true"
  package:
    description: "package"
    required: false
  no-default-features:
    description: "no-default-features"
    required: false
    default: "false"
  profile:
    description: "profile"
    required: false
    default: "release"

runs:
  using: "composite"
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        rustflags: ${{ inputs.rustflags }}
        toolchain: ${{ inputs.toolchain }}

    - uses: ahaoboy/aarch64-linux-musl-cross-build@v1
      if: startsWith(inputs.target, 'aarch64-unknown-linux')

    - name: install cross
      shell: bash
      run: |
        cargo install -q cross --git https://github.com/cross-rs/cross
        cargo clean
    - uses: taiki-e/upload-rust-binary-action@v1
      with:
        dry-run: true
        bin: ${{ inputs.bin }}
        target: ${{ inputs.target }}
        token: ${{ inputs.GITHUB_TOKEN }}
        features: ${{ inputs.features }}
        archive: ${{ inputs.archive }}
        package: ${{ inputs.package }}
        profile: ${{ inputs.profile }}
        no-default-features: ${{ inputs.no-default-features }}
        ref: "refs/tags/dummy"
      env:
        RUSTFLAGS: ${{ inputs.RUSTFLAGS }}
    - uses: actions/upload-artifact@v4
      if: ${{ inputs.upload-artifact == 'true' }}
      with:
        name: ${{ inputs.archive == '$bin-$target' && format('{0}-{1}', inputs.bin, inputs.target) || inputs.archive }}
        path: ${{ format('{0}.*', (inputs.archive == '$bin-$target' && format('{0}-{1}', inputs.bin, inputs.target) || inputs.archive)) }}
    - name: release nightly
      uses: ncipollo/release-action@v1
      if: ${{ inputs.tag != '' }}
      with:
        tag: ${{ inputs.tag }}
        artifacts: ${{ format('{0}.*', (inputs.archive == '$bin-$target' && format('{0}-{1}', inputs.bin, inputs.target) || inputs.archive)) }}
        allowUpdates: ${{ inputs.allowUpdates }}
        makeLatest: ${{ inputs.makeLatest }}
        token: ${{ inputs.GITHUB_TOKEN }}
